<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
<defs>
  <!-- Deep navy disc -->
  <radialGradient id="discBg" cx="50%" cy="38%" r="70%">
    <stop offset="0%" stop-color="#1e3a5f"/>
    <stop offset="45%" stop-color="#0c1a30"/>
    <stop offset="100%" stop-color="#030810"/>
  </radialGradient>

  <!-- Premium polished gold -->
  <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#fff9d6"/>
    <stop offset="15%" stop-color="#f5d76e"/>
    <stop offset="35%" stop-color="#d4a017"/>
    <stop offset="55%" stop-color="#f7e08a"/>
    <stop offset="75%" stop-color="#c49212"/>
    <stop offset="100%" stop-color="#7a5208"/>
  </linearGradient>

  <!-- Gold rim bevel (light top → dark bottom) -->
  <linearGradient id="goldRim" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#fff8d0"/>
    <stop offset="25%" stop-color="#e8c04a"/>
    <stop offset="60%" stop-color="#b8860b"/>
    <stop offset="100%" stop-color="#6b4a0a"/>
  </linearGradient>

  <!-- Bright gold highlight edge -->
  <linearGradient id="goldEdge" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#fffef0"/>
    <stop offset="40%" stop-color="#f0d060"/>
    <stop offset="100%" stop-color="#a07010"/>
  </linearGradient>

  <!-- Chrome / silver for text -->
  <linearGradient id="silver" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#ffffff"/>
    <stop offset="25%" stop-color="#eef2f7"/>
    <stop offset="55%" stop-color="#b0bcc9"/>
    <stop offset="80%" stop-color="#7a8796"/>
    <stop offset="100%" stop-color="#4a5564"/>
  </linearGradient>

  <!-- Silver side sheen -->
  <linearGradient id="silverShine" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
    <stop offset="40%" stop-color="#c8d0dc" stop-opacity="0.3"/>
    <stop offset="100%" stop-color="#6a7585" stop-opacity="0.6"/>
  </linearGradient>

  <!-- Outer drop shadow -->
  <filter id="outerGlow" x="-40%" y="-40%" width="180%" height="180%">
    <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.55"/>
    <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
  </filter>

  <!-- Raised element shadow -->
  <filter id="raised" x="-25%" y="-25%" width="150%" height="150%">
    <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    <feDropShadow dx="0" dy="-1" stdDeviation="1.5" flood-color="#fff" flood-opacity="0.25"/>
  </filter>

  <!-- Deep text emboss -->
  <filter id="textEmboss" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="4" stdDeviation="2" flood-color="#000" flood-opacity="0.8"/>
    <feDropShadow dx="0" dy="-2" stdDeviation="1.2" flood-color="#fff" flood-opacity="0.4"/>
  </filter>

  <!-- Gold text emboss -->
  <filter id="goldEmboss" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="5" stdDeviation="2.5" flood-color="#000" flood-opacity="0.75"/>
    <feDropShadow dx="0" dy="-2" stdDeviation="1.5" flood-color="#fff8d0" flood-opacity="0.45"/>
  </filter>

  <clipPath id="discClip">
    <circle cx="400" cy="400" r="320"/>
  </clipPath>
</defs>

<!-- ========== OUTER TROPHY RIM (multi-layer) ========== -->
<!-- Dark base plate -->
<circle cx="400" cy="400" r="392" fill="#0a0602" filter="url(#outerGlow)"/>

<!-- Thick outer gold ring -->
<circle cx="400" cy="400" r="385" fill="url(#goldRim)"/>

<!-- Inner bevel highlight ring -->
<circle cx="400" cy="400" r="362" fill="none" stroke="url(#goldEdge)" stroke-width="14"/>

<!-- Thin bright inner gold line -->
<circle cx="400" cy="400" r="348" fill="none" stroke="#f5e6a0" stroke-width="3" opacity="0.9"/>

<!-- ========== MAIN DISC ========== -->
<circle cx="400" cy="400" r="340" fill="url(#discBg)"/>

<!-- Subtle inner ring -->
<circle cx="400" cy="400" r="330" fill="none" stroke="#1a3050" stroke-width="2" opacity="0.6"/>

<!-- ========== PITCH / FIELD ========== -->
<g clip-path="url(#discClip)" opacity="0.55">
  <rect x="50" y="560" width="700" height="220" fill="#0a3d26"/>
  <path d="M80 650H720M400 560V780M250 560v220M550 560v220" stroke="#fff" stroke-width="2" opacity="0.28"/>
  <ellipse cx="400" cy="720" rx="110" ry="42" fill="none" stroke="#fff" stroke-width="2" opacity="0.35"/>
</g>

<!-- ========== CROWN (raised gold) ========== -->
<path d="M278 195 L325 108 L400 152 L475 108 L522 195 L482 252 L318 252 Z"
      fill="url(#gold)" stroke="#6b4a0a" stroke-width="6" filter="url(#raised)"/>
<!-- Crown top highlight -->
<path d="M290 195 L325 120 L400 158 L475 120 L510 195 L480 200 L320 200 Z"
      fill="url(#goldEdge)" opacity="0.35"/>
<!-- Jewels -->
<circle cx="325" cy="118" r="12" fill="#fff8d0" stroke="#c9a020" stroke-width="2.5"/>
<circle cx="400" cy="150" r="13" fill="#fff8d0" stroke="#c9a020" stroke-width="2.5"/>
<circle cx="475" cy="118" r="12" fill="#fff8d0" stroke="#c9a020" stroke-width="2.5"/>

<!-- ========== CENTRAL MEDALLION ========== -->
<circle cx="400" cy="285" r="88" fill="#071018" stroke="url(#gold)" stroke-width="10" filter="url(#raised)"/>
<circle cx="400" cy="285" r="76" fill="none" stroke="#1a2a40" stroke-width="2"/>

<!-- Silver star / emblem -->
<path d="M400 215l22 16 26-2 9 25 23 15-14 24 7 26-26 7-17 21-23-14-23 14-17-21-26-7 7-26-14-24 23-15 9-25 26 2z"
      fill="url(#silver)" stroke="#1a2230" stroke-width="5"/>
<path d="M400 232v40M360 258l32 20M440 258l-32 20M375 322l22-22M425 322l-22-22"
      stroke="#1a2230" stroke-width="7" fill="none" stroke-linecap="round"/>

<!-- ========== RAISED BANNER PLATE ========== -->
<!-- Banner shadow base -->
<path d="M138 325 Q400 268 662 325 L632 510 Q400 568 168 510 Z"
      fill="#040a12" opacity="0.5"/>
<!-- Main banner -->
<path d="M142 322 Q400 265 658 322 L630 505 Q400 560 170 505 Z"
      fill="#0a1525" stroke="url(#gold)" stroke-width="12" filter="url(#raised)"/>
<!-- Banner inner bevel -->
<path d="M162 340 Q400 290 638 340 L615 485 Q400 530 185 485 Z"
      fill="none" stroke="#152538" stroke-width="3" opacity="0.7"/>
<!-- Top gold edge highlight on banner -->
<path d="M155 328 Q400 275 645 328" fill="none" stroke="#f5e090" stroke-width="2.5" opacity="0.5"/>

<!-- ========== EMBOSSED TEXT ========== -->
<!-- LAST MAN underlayer (thickness) -->
<text x="400" y="410" text-anchor="middle"
      font-family="Arial Black, Impact, Helvetica, sans-serif"
      font-size="82" font-weight="900"
      fill="#020508">LAST MAN</text>
<!-- LAST MAN silver -->
<text x="400" y="406" text-anchor="middle"
      font-family="Arial Black, Impact, Helvetica, sans-serif"
      font-size="82" font-weight="900"
      fill="url(#silver)"
      stroke="#0a1018" stroke-width="3.5"
      paint-order="stroke"
      filter="url(#textEmboss)">LAST MAN</text>

<!-- STANDING underlayer -->
<text x="400" y="486" text-anchor="middle"
      font-family="Arial Black, Impact, Helvetica, sans-serif"
      font-size="70" font-weight="900"
      fill="#1a1004">STANDING</text>
<!-- STANDING gold -->
<text x="400" y="482" text-anchor="middle"
      font-family="Arial Black, Impact, Helvetica, sans-serif"
      font-size="70" font-weight="900"
      fill="url(#gold)"
      stroke="#3a2208" stroke-width="3"
      paint-order="stroke"
      filter="url(#goldEmboss)">STANDING</text>

<!-- Decorative gold underline -->
<path d="M240 515 Q400 545 560 515" fill="none" stroke="url(#gold)" stroke-width="5" stroke-linecap="round"/>

<!-- Trophy star -->
<path d="M400 535l10 21 23 2.5-17 16 4.5 23-20.5-11-20.5 11 4.5-23-17-16 23-2.5z"
      fill="url(#gold)" stroke="#6b4a0a" stroke-width="2" filter="url(#textEmboss)"/>
</svg>
